<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Legible — Copy text from any PDF or image</title>
    <meta name="description" content="Scan PDFs and images right in your browser and select, copy or export their text. Powered by PP-OCRv6. Nothing is uploaded." />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="app" id="app" data-state="empty">
      <header class="topbar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="5" y="3" width="22" height="26" rx="5" fill="currentColor" opacity=".14" />
            <path d="M10 11h12M10 16h12M10 21h7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
            <path d="M3 9V6a3 3 0 0 1 3-3h3M23 3h3a3 3 0 0 1 3 3v3M29 23v3a3 3 0 0 1-3 3h-3M9 29H6a3 3 0 0 1-3-3v-3" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" fill="none" />
          </svg>
          <span class="brand-name">Legible</span>
        </div>

        <div class="engine" id="engine" role="status" aria-live="polite">
          <span class="engine-dot"></span>
          <span class="engine-label" id="engine-label">Preparing text recognition…</span>
          <span class="engine-bar"><span id="engine-bar"></span></span>
        </div>

        <div class="actions">
          <button class="btn ghost when-docs" id="copy-all" title="Copy all recognized text">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="6.5" y="6.5" width="10" height="11" rx="2.2" /><path d="M13.5 6.5V5a2 2 0 0 0-2-2H5.5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h1" /></svg>
            <span class="label">Copy all</span>
          </button>
          <button class="btn ghost when-docs" id="export" title="Download all text as a .txt file">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10m0 0-4-4m4 4 4-4M4 15.5v.5a1.5 1.5 0 0 0 1.5 1.5h9A1.5 1.5 0 0 0 16 16v-.5" /></svg>
            <span class="label">Export</span>
          </button>
          <button class="btn primary" id="add" title="Add documents (Ctrl/⌘ O)">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" /></svg>
            <span class="label">Add documents</span>
          </button>
        </div>
      </header>

      <div class="body">
        <aside class="sidebar" aria-label="Documents">
          <div class="side-head">
            <span>Documents</span>
            <span class="side-count" id="doc-count">0</span>
          </div>
          <ul class="doc-list" id="doc-list"></ul>
          <div class="side-foot">
            <div class="seg" role="radiogroup" aria-label="Recognition model">
              <button role="radio" data-tier="small" title="PP-OCRv6 small — best accuracy, 31 MB one-time download">Accurate</button>
              <button role="radio" data-tier="tiny" title="PP-OCRv6 tiny — faster, 6 MB download">Fast</button>
            </div>
            <label class="toggle">
              <input type="checkbox" id="show-boxes" />
              <span class="toggle-track"><span></span></span>
              Show detected text
            </label>
            <p class="privacy">
              <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4.5" y="9" width="11" height="8" rx="2" /><path d="M7 9V6.5a3 3 0 0 1 6 0V9" /></svg>
              Runs entirely on this device. Your files never leave your browser.
            </p>
          </div>
        </aside>

        <main class="viewer" id="viewer" tabindex="-1">
          <section class="empty" id="empty">
            <button class="dropcard" id="dropcard" type="button">
              <div class="dropcard-art" aria-hidden="true">
                <div class="sheet s1"></div>
                <div class="sheet s2"></div>
                <div class="sheet s3"><i></i><i></i><i></i><i></i><b></b></div>
              </div>
              <h1>Copy text from any document</h1>
              <p>Drop PDFs or images here, or <span class="link">choose files</span>.<br />Every page is scanned so you can select and copy its text.</p>
              <span class="formats">PDF · PNG · JPEG · WebP · and more</span>
            </button>
            <p class="empty-note">
              <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4.5" y="9" width="11" height="8" rx="2" /><path d="M7 9V6.5a3 3 0 0 1 6 0V9" /></svg>
              Private by design — recognition runs locally with PP-OCRv6.
            </p>
          </section>
          <div class="docs" id="docs"></div>
        </main>
      </div>

      <div class="dock when-docs" id="dock">
        <span class="dock-page" id="dock-page">—</span>
        <span class="dock-sep"></span>
        <button class="icon-btn" id="zoom-out" title="Zoom out (Ctrl/⌘ −)" aria-label="Zoom out"><svg viewBox="0 0 20 20"><path d="M5 10h10" /></svg></button>
        <button class="dock-zoom" id="zoom-reset" title="Fit width">100%</button>
        <button class="icon-btn" id="zoom-in" title="Zoom in (Ctrl/⌘ +)" aria-label="Zoom in"><svg viewBox="0 0 20 20"><path d="M10 5v10M5 10h10" /></svg></button>
      </div>
    </div>

    <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
      <div class="drop-target">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 8v24m0-24-8 8m8-8 8 8M10 30v6a4 4 0 0 0 4 4h20a4 4 0 0 0 4-4v-6" /></svg>
        <span>Drop to scan</span>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <dialog class="modal" id="pw-dialog">
      <form method="dialog">
        <h2>Password required</h2>
        <p id="pw-text">This PDF is protected.</p>
        <input type="password" id="pw-input" autocomplete="off" placeholder="Password" required />
        <div class="modal-actions">
          <button class="btn ghost" value="cancel" formnovalidate>Skip</button>
          <button class="btn primary" value="ok">Unlock</button>
        </div>
      </form>
    </dialog>

    <input type="file" id="file-input" multiple accept="application/pdf,.pdf,image/*,.heic,.heif" hidden />
    <noscript><p style="padding:2rem;font-family:system-ui">Legible needs JavaScript to scan documents.</p></noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
